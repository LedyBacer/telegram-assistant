services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    command: python -m assistant.api.main
    env_file: .env
    # Loopback-only: Uvicorn is never exposed directly to the network. A
    # public Mini App is served through an HTTPS reverse proxy that
    # terminates TLS and forwards to 127.0.0.1:8000 (see README "Network
    # exposure").
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/data/storage

  bot:
    build: .
    command: python -m assistant.bot.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/data/storage

  worker:
    build: .
    command: python -m assistant.worker.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/data/storage

volumes:
  postgres_data:
