services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage:/data/storage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    command: python -m assistant.api.main
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/data/storage

  bot:
    build: .
    command: python -m assistant.bot.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/data/storage

  worker:
    build: .
    command: python -m assistant.worker.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/data/storage

volumes:
  postgres_data:
