<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Smart Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/miniapp/app.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main id="app" class="max-w-2xl mx-auto p-4 pb-24 space-y-4">
    <header class="flex items-baseline justify-between">
      <h1 class="text-2xl font-bold">Smart Assistant</h1>
      <span id="who" class="text-slate-400 text-sm"></span>
    </header>
    <p id="status" class="text-slate-400">Loading…</p>
    <nav id="tabs" class="flex gap-2 overflow-x-auto pb-1 text-sm"></nav>
    <section id="view" class="space-y-3"></section>
  </main>
</body>
</html>
