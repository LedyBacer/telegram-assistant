<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="theme-color" content="#ffffff" />
  <title>Ассистент</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="/miniapp/styles.css" />
  <!--
    Telegram WebApp SDK. Inside the real Telegram client this exposes
    window.Telegram.WebApp (initData, themeParams, BackButton, ...). In a
    plain browser the script is unavailable and the app degrades gracefully:
    js/telegram.js is the ONLY place that touches window.Telegram, and every
    access is guarded. The Playwright harness injects a deterministic mock
    instead of this CDN script (and the CDN request is intercepted).
  -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ru.js"></script>
  <script type="module" src="/miniapp/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="app-title" id="app-title">Ассистент</h1>
      <span class="who" id="who"></span>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav id="nav" class="bottomnav" aria-label="Навигация"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="sheet-root"></div>
  </div>
</body>
</html>
