[project]
name = "telegram-assistant"
version = "0.1.0"
description = "Smart personal assistant and motivator Telegram bot with calendar, workouts, files, and AI features"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "openai>=1.40",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ASYNC",
    "RET",
    "PTH",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported by name from other test modules (e.g. `client`).
"tests/**/*.py" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection: Depends()/Query() defaults are intentional.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
